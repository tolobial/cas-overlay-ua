#
# Déclaration du thème UA pour CAS 7.3
#
# Ces clés indiquent à CAS où trouver les fichiers CSS et JavaScript
# spécifiques au thème. Quand un service utilise "theme: ua" dans son JSON
# (ou quand le thème par défaut est positionné sur "ua"), CAS injecte ces
# fichiers dans toutes les vues à la place des fichiers par défaut.
#
# Les chemins sont relatifs à src/main/resources/static/, donc :
#   /themes/ua/css/ua.css  →  src/main/resources/static/themes/ua/css/ua.css
#

cas.standard.css.file=/themes/ua/css/ua.css
cas.standard.js.file=/themes/ua/js/ua.js
