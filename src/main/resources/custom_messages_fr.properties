#
# Messages français — Thème UA pour CAS 7.3
#
# Ce fichier override certaines clés CAS standard avec du texte propre
# (sans HTML accesskey, sans deux-points final) adapté au design UA,
# et ajoute les nouvelles clés UA spécifiques (footer, pôles).
#
# Spring Boot merge automatiquement ce fichier avec messages_fr.properties.
# Les clés ici ont la priorité sur celles du messages_fr.properties standard.
#

# === Page de login — titres ===
screen.welcome.welcome=Bienvenue
screen.welcome.instructions=Connectez-vous pour accéder aux services numériques

# === Champs du formulaire ===
# (sans le <span class="accesskey"> du standard CAS qui s'affichait en brut)
screen.welcome.label.netid=Identifiant du compte SESAME
screen.welcome.label.netid.placeholder=identifiant*
screen.welcome.label.password=Mot de passe
screen.welcome.label.password.placeholder=••••••••
screen.welcome.button.login=Se connecter

# === Message d'aide en bas du formulaire ===
# (sans le <a href="logout"> du standard CAS qui s'affichait en brut)
screen.welcome.security=Pour des raisons de sécurité, pensez à vous déconnecter et fermer votre navigateur après usage.

# === Remember me (TGT longue durée) ===
screen.rememberme.checkbox=Se souvenir de moi sur cet appareil

# === Liens annexes ===
screen.welcome.password.forgot=Mot de passe oublié ?

# === Clés propres au thème UA (footer + badges pôles) ===
ua.footer.label=Université des Antilles
ua.footer.text=— Système d'authentification (CAS)
ua.footer.poweredby=Direction des Systèmes d'Information et du Numérique
ua.pole.guadeloupe=Guadeloupe
ua.pole.martinique=Martinique

# === UA-PHASE4BIS-MFA-MESSAGES-MARKER ===
